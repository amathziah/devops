name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: shopsmart

jobs:
  # ─── Lint (runs on push and PRs) ───────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install backend deps
        run: npm install
        working-directory: server

      - name: Lint backend
        run: npm run lint
        working-directory: server

      - name: Install frontend deps
        run: npm install
        working-directory: client

      - name: Lint frontend
        run: npm run lint
        working-directory: client

  # ─── Phase 1: Tests ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install backend deps
        run: npm install
        working-directory: server

      - name: Backend unit & integration tests
        run: npm test -- --coverage
        working-directory: server

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage

      - name: Install frontend deps
        run: npm install
        working-directory: client

      - name: Frontend tests
        run: npm test -- --run --coverage
        working-directory: client

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage

  # ─── Phase 2: Terraform ────────────────────────────────────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      ecr_backend_url: ${{ steps.tf_outputs.outputs.ecr_backend_url }}
      ecr_frontend_url: ${{ steps.tf_outputs.outputs.ecr_frontend_url }}
      ecs_cluster: ${{ steps.tf_outputs.outputs.ecs_cluster }}
      ecs_service: ${{ steps.tf_outputs.outputs.ecs_service }}
      alb_url: ${{ steps.tf_outputs.outputs.alb_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create Terraform state bucket
        run: |
          aws s3 mb s3://shopsmart-tfstate-008165007254 --region us-east-1 2>/dev/null || true
          aws s3api put-bucket-versioning \
            --bucket shopsmart-tfstate-008165007254 \
            --versioning-configuration Status=Enabled 2>/dev/null || true

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Import existing AWS resources
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text)

          terraform import aws_s3_bucket.app shopsmart-app-008165007254 2>/dev/null || true
          terraform import aws_s3_bucket_versioning.app shopsmart-app-008165007254 2>/dev/null || true
          terraform import aws_s3_bucket_server_side_encryption_configuration.app shopsmart-app-008165007254 2>/dev/null || true
          terraform import aws_s3_bucket_public_access_block.app shopsmart-app-008165007254 2>/dev/null || true

          terraform import aws_ecr_repository.backend shopsmart-backend 2>/dev/null || true
          terraform import aws_ecr_repository.frontend shopsmart-frontend 2>/dev/null || true

          terraform import aws_iam_role.ecs_task_execution shopsmart-ecs-exec-role 2>/dev/null || true
          terraform import aws_iam_role_policy_attachment.ecs_task_execution "shopsmart-ecs-exec-role/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" 2>/dev/null || true

          terraform import aws_cloudwatch_log_group.ecs /ecs/shopsmart 2>/dev/null || true

          CLUSTER_ARN=$(aws ecs describe-clusters --clusters shopsmart-cluster --query "clusters[0].clusterArn" --output text 2>/dev/null || echo "")
          [ -n "$CLUSTER_ARN" ] && [ "$CLUSTER_ARN" != "None" ] && terraform import aws_ecs_cluster.main "$CLUSTER_ARN" 2>/dev/null || true

          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=shopsmart-ecs-sg" "Name=vpc-id,Values=$VPC_ID" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "")
          [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && terraform import aws_security_group.ecs "$SG_ID" 2>/dev/null || true

          ALB_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=shopsmart-alb-sg" "Name=vpc-id,Values=$VPC_ID" --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "")
          [ -n "$ALB_SG_ID" ] && [ "$ALB_SG_ID" != "None" ] && terraform import aws_security_group.alb "$ALB_SG_ID" 2>/dev/null || true

          ALB_ARN=$(aws elbv2 describe-load-balancers --names shopsmart-alb --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || echo "")
          [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] && terraform import aws_lb.app "$ALB_ARN" 2>/dev/null || true

          FE_TG_ARN=$(aws elbv2 describe-target-groups --names shopsmart-fe-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          [ -n "$FE_TG_ARN" ] && [ "$FE_TG_ARN" != "None" ] && terraform import aws_lb_target_group.frontend "$FE_TG_ARN" 2>/dev/null || true

          BE_TG_ARN=$(aws elbv2 describe-target-groups --names shopsmart-be-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || echo "")
          [ -n "$BE_TG_ARN" ] && [ "$BE_TG_ARN" != "None" ] && terraform import aws_lb_target_group.backend "$BE_TG_ARN" 2>/dev/null || true

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            FE_LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query "Listeners[?Port==\`80\`].ListenerArn" --output text 2>/dev/null || echo "")
            [ -n "$FE_LISTENER_ARN" ] && [ "$FE_LISTENER_ARN" != "None" ] && terraform import aws_lb_listener.frontend "$FE_LISTENER_ARN" 2>/dev/null || true
          fi

          terraform import aws_ecs_service.app "shopsmart-cluster/shopsmart-service" 2>/dev/null || true

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -var="aws_region=${{ secrets.AWS_REGION }}" -out=tfplan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Capture outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "ecr_backend_url=$(terraform output -raw ecr_backend_url)" >> $GITHUB_OUTPUT
          echo "ecr_frontend_url=$(terraform output -raw ecr_frontend_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "alb_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT

  # ─── Phase 3: Docker Build & Push to ECR ──────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'
    env:
      ECR_BACKEND: 008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-backend
      ECR_FRONTEND: 008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-backend:latest
            008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-backend:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-frontend:latest
            008165007254.dkr.ecr.us-east-1.amazonaws.com/shopsmart-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ needs.terraform.outputs.alb_url }}

  # ─── Phase 3 cont.: Deploy to ECS Fargate ─────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [terraform, build-push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster shopsmart-cluster \
            --service shopsmart-service \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster shopsmart-cluster \
            --services shopsmart-service
          echo "ECS service is running and stable."
